<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Archipel Sémantique — Constellation d'Idées</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      line-height: 1.6;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      height: 100vh;
      gap: 0;
    }
    
    .sidebar {
      width: 320px;
      background: #111;
      border-right: 1px solid #222;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .sidebar h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .upload-zone {
      border: 2px dashed #333;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .upload-zone:hover {
      border-color: #666;
      background: rgba(255, 255, 255, 0.02);
    }
    
    .upload-zone.dragover {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.1);
    }
    
    .upload-zone input {
      display: none;
    }
    
    .upload-zone p {
      font-size: 13px;
      color: #888;
      cursor: pointer;
    }
    
    .info-panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .info-item:last-child {
      margin-bottom: 0;
    }
    
    .info-label {
      color: #666;
    }
    
    .info-value {
      color: #8b5cf6;
      font-weight: 600;
    }
    
    .chunks-list {
      border-top: 1px solid #222;
      padding-top: 12px;
      margin-top: 12px;
    }
    
    .chunks-list-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .chunk-item {
      padding: 8px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid transparent;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .chunk-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-left-color: #8b5cf6;
    }
    
    .chunk-item.active {
      background: rgba(139, 92, 246, 0.2);
      border-left-color: #8b5cf6;
      color: #8b5cf6;
    }
    
    .canvas-wrapper {
      flex: 1;
      position: relative;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
      overflow: hidden;
    }
    
    #archipelCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    .status-bar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(10, 10, 10, 0.8);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 12px;
      color: #888;
      backdrop-filter: blur(8px);
    }
    
    .status-bar.processing {
      color: #8b5cf6;
    }
    
    .status-bar.error {
      color: #ff6b6b;
    }
    
    .status-bar.success {
      color: #51cf66;
    }
    
    .tooltip {
      position: absolute;
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      max-width: 280px;
      pointer-events: none;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    
    .tooltip.visible {
      opacity: 1;
    }
    
    .tooltip.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        height: auto;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid #222;
      }
      
      .canvas-wrapper {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>L'Archipel Sémantique</h1>
      
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
        <p>📄 Déposer un fichier<br/>(PDF, TXT, Markdown)</p>
      </div>
      
      <div class="info-panel">
        <div class="info-item">
          <span class="info-label">Chunks:</span>
          <span class="info-value" id="chunkCount">0</span>
        </div>
        <div class="info-item">
          <span class="info-label">Embeddings:</span>
          <span class="info-value" id="embeddingCount">0</span>
        </div>
        <div class="info-item">
          <span class="info-label">Status:</span>
          <span class="info-value" id="statusLabel">ready</span>
        </div>
      </div>
      
      <div class="chunks-list" id="chunksList" style="display: none;">
        <div class="chunks-list-title">Fragments</div>
        <div id="chunksContainer"></div>
      </div>
    </div>
    
    <div class="canvas-wrapper">
      <canvas id="archipelCanvas"></canvas>
      <div class="status-bar" id="statusBar">Ready</div>
      <div class="tooltip hidden" id="tooltip"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="archipel.js"></script>
</body>
</html>
