<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Philosophers Discovery Atlas</title>
  <meta name="description" content="Dense interactive philosophy atlas: thinkers, concepts, problems, postulates, supports, oppositions, reading routes, comparison." />
  <style>
    :root{--bg:#f3efe7;--paper:#fffdf8;--paper2:#f8f3ea;--ink:#16130f;--muted:#786f62;--faint:#a79e91;--line:rgba(22,19,15,.135);--line2:rgba(22,19,15,.08);--blue:#255cff;--red:#ba3f36;--green:#2f7354;--gold:#9d741c;--violet:#7257c8;--shadow:0 18px 60px rgba(34,27,14,.11);--r:18px;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;--serif:ui-serif,Georgia,"New York",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--pad:10px;--fs:12px} [data-theme=dark]{--bg:#0f0f0e;--paper:#171716;--paper2:#1d1c1a;--ink:#f6f0e7;--muted:#aaa094;--faint:#786f66;--line:rgba(246,240,231,.16);--line2:rgba(246,240,231,.08);--blue:#83acff;--red:#ff8c82;--green:#9bd8ad;--gold:#d5b35d;--violet:#b7a7ff;--shadow:0 20px 80px rgba(0,0,0,.36)}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;overflow:hidden;background:radial-gradient(circle at 8% -8%,rgba(37,92,255,.12),transparent 34%),radial-gradient(circle at 85% 2%,rgba(186,63,54,.1),transparent 30%),linear-gradient(180deg,var(--bg),var(--paper2));color:var(--ink);font-family:var(--sans);font-size:var(--fs)} button,input,select{font:inherit;color:inherit} button{cursor:pointer} b{font-weight:650} p{margin:0;color:var(--muted);line-height:1.35}.app{height:100%;display:grid;grid-template-columns:258px minmax(0,1fr) 330px;grid-template-rows:1fr;gap:10px;padding:10px}.panel{min-height:0;border:1px solid var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--paper) 78%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}.side,.main,.inspect{display:flex;flex-direction:column}.brand{padding:12px 13px;border-bottom:1px solid var(--line)}.brand h1{margin:0;font:680 18px/1 var(--serif);letter-spacing:-.02em}.brand p{margin-top:5px;font-size:11px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border-bottom:1px solid var(--line)}.stat{border:1px solid var(--line2);background:rgba(255,255,255,.22);border-radius:13px;padding:7px}.stat strong{display:block;font-size:17px;line-height:1}.stat span,.cap{font:9px/1.1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.search{padding:8px;border-bottom:1px solid var(--line)}input[type=search],input[type=text]{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:9px 10px;outline:none}.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-bottom:1px solid var(--line)}button,.btn{border:1px solid var(--line);background:rgba(255,255,255,.22);border-radius:12px;padding:7px 9px;text-align:left;text-decoration:none;color:inherit}button.active,.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.section{padding:8px;border-bottom:1px solid var(--line);min-height:0}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow:auto}.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.16);padding:5px 7px;font:10px/1.1 var(--mono)}.chip small{color:var(--muted)}.mainTop{padding:8px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.title{font:680 18px/1.05 var(--serif);letter-spacing:-.015em}.sub{font-size:11px}.tools{display:flex;gap:6px;align-items:center}.activeBar{border-bottom:1px solid var(--line);padding:7px 10px;display:flex;gap:6px;align-items:center;overflow:auto;min-height:40px;background:rgba(255,255,255,.13)}.content{min-height:0;overflow:auto;padding:10px}.grid{display:grid;gap:9px}.cols2{grid-template-columns:1.05fr .95fr}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.card,.claim,.miniCard{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.035)}.miniCard{padding:8px;background:rgba(255,255,255,.18)}h2,h3{margin:0}h2{font-size:14px}h3{font-size:12px}.claim{display:grid;gap:6px}.claimText{font-size:12px;line-height:1.33}.meta{display:flex;gap:4px;flex-wrap:wrap}.tag{border:1px solid var(--line2);background:rgba(0,0,0,.025);border-radius:999px;padding:3px 5px;font:9px/1 var(--mono);color:var(--muted)}.problemTag{color:var(--ink);background:color-mix(in srgb,var(--blue) 10%,transparent)}.who{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font:9px var(--mono)}.rel{border-left:2px solid var(--line);padding:4px 0 4px 7px;font-size:11px;line-height:1.25}.support{border-color:var(--blue)}.oppose{border-color:var(--red)}.graphBox{height:340px;position:relative;overflow:hidden}.graphBox.tall{height:520px}.graphBox svg{width:100%;height:100%;display:block}.edge{stroke-opacity:.42}.edge.support{stroke:var(--blue)}.edge.oppose{stroke:var(--red)}.node{cursor:pointer}.svglabel{font:9px var(--sans);fill:var(--muted);pointer-events:none}.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:6px}.heat button{padding:7px;border-radius:13px}.bar{height:4px;background:var(--line2);border-radius:999px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--ink)}.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:9px}.indexList{overflow:auto;max-height:calc(100vh - 165px);display:grid;gap:6px}.indexItem{display:grid;gap:3px}.indexDetail{display:grid;gap:9px}.group{border:1px solid var(--line);border-radius:15px;background:var(--paper);overflow:hidden}.groupHead{display:flex;justify-content:space-between;gap:8px;padding:8px 9px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.16)}.postulates{padding:5px 8px;display:grid;gap:4px}.postulate{padding:5px 0;border-bottom:1px solid var(--line2);font-size:11px;line-height:1.3}.postulate:last-child{border-bottom:0}.route{display:flex;gap:8px;overflow:auto;padding:2px 0 7px}.step{min-width:210px;border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:9px}.matrix{display:grid;grid-template-columns:160px repeat(var(--cols,6),minmax(70px,1fr));gap:3px;align-items:stretch;overflow:auto}.cell{padding:6px;border:1px solid var(--line2);background:rgba(255,255,255,.16);min-height:28px;font-size:10px}.cell.hot{background:color-mix(in srgb,var(--blue) calc(var(--p)*1%),transparent)}.inspectorTop{padding:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.inspectorBody{padding:10px;overflow:auto;display:grid;gap:9px}.drop{border:1px dashed var(--line);border-radius:14px;padding:9px;background:rgba(255,255,255,.1)}.densityCompact .claimText{font-size:11px}.densityCompact .claim,.densityCompact .card{padding:8px}.bottomNav{display:none}.empty{padding:16px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
    @media(max-width:1180px){.app{grid-template-columns:235px minmax(0,1fr);grid-template-rows:1fr 310px}.inspect{grid-column:1/-1}.cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.graphBox.tall{height:420px}.split{grid-template-columns:220px minmax(0,1fr)}}
    @media(max-width:780px){body{overflow:auto}.app{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto;gap:8px;padding:8px 8px 70px}.side{order:1}.main{order:2}.inspect{order:3}.brand{padding:10px}.side .section{display:none}.statgrid{grid-template-columns:repeat(3,1fr)}.nav{grid-template-columns:repeat(4,1fr);overflow:auto}.nav button{white-space:nowrap;text-align:center}.cols2,.cols3,.split{grid-template-columns:1fr}.indexList{max-height:230px}.mainTop{position:sticky;top:0;z-index:3;background:var(--paper)}.activeBar{position:sticky;top:48px;z-index:2;background:var(--paper)}.graphBox,.graphBox.tall{height:330px}.bottomNav{display:grid;position:fixed;left:8px;right:8px;bottom:8px;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--paper) 92%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(20px);z-index:10}.bottomNav button{text-align:center;padding:8px 3px;font-size:10px}.inspect{max-height:none}}
  </style>
</head>
<body>
  <noscript><div style="padding:22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">JavaScript is required for the interactive atlas.</div></noscript>
  <div id="app" class="app densityCompact" data-theme="light">
    <aside class="panel side">
      <div class="brand"><h1>Philosophers Atlas</h1><p>Dense map of thinkers, concepts, problems, postulates, influence, opposition.</p></div>
      <div class="statgrid" id="stats"></div>
      <div class="search"><input id="q" type="search" placeholder="Search postulates, authors, concepts…"></div>
      <div class="nav" id="nav"></div>
      <div class="section"><div class="sectionHead"><span class="cap">Concept index</span><button class="chip" data-act="view" data-val="index">open</button></div><div class="chips" id="conceptRail"></div></div>
      <div class="section"><div class="sectionHead"><span class="cap">Problem index</span><button class="chip" data-act="view" data-val="index" data-kind="problem">open</button></div><div class="chips" id="problemRail"></div></div>
      <div class="section"><div class="sectionHead"><span class="cap">Reading routes</span><button class="chip" data-act="view" data-val="routes">open</button></div><div class="chips" id="routeRail"></div></div>
    </aside>
    <main class="panel main">
      <div class="mainTop"><div><div class="title" id="viewTitle">Atlas</div><p class="sub" id="sub"></p></div><div class="tools"><button id="density" class="chip">Dense</button><button id="theme" class="chip">Theme</button><button id="reset" class="chip">Reset</button></div></div>
      <div class="activeBar" id="activeBar"></div>
      <div class="content" id="content"><div class="empty">Loading philosophers.json…</div></div>
    </main>
    <aside class="panel inspect"><div class="inspectorTop"><h2>Inspector</h2><button class="chip" data-act="view" data-val="upload">Upload</button></div><div class="inspectorBody" id="inspector"></div></aside>
  </div>
  <div class="bottomNav" id="bottomNav"></div>
  <script src="app.js" defer></script>
</body>
</html>
