<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Philosophers Discovery Atlas</title>
  <meta name="description" content="Interactive philosophy atlas: thinkers, concepts, problems, supports, oppositions, threads, comparison." />
  <style>
    :root{--bg:#f5f1e9;--paper:#fffdfa;--ink:#171512;--muted:#766f63;--line:rgba(23,21,18,.13);--soft:rgba(255,255,255,.54);--blue:#245cff;--red:#bd3f37;--green:#397153;--shadow:0 24px 70px rgba(34,27,14,.1);--r:22px;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;--serif:ui-serif,Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace} [data-theme=dark]{--bg:#10100f;--paper:#171716;--ink:#f6f0e7;--muted:#aaa398;--line:rgba(246,240,231,.14);--soft:rgba(255,255,255,.06);--blue:#8ab4ff;--red:#ff8a80;--green:#9bd6ad;--shadow:0 24px 80px rgba(0,0,0,.34)} *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle at 12% 0,rgba(36,92,255,.11),transparent 34%),radial-gradient(circle at 86% 0,rgba(189,63,55,.09),transparent 30%),var(--bg);color:var(--ink);font-family:var(--sans)} button,input{font:inherit;color:inherit}button{cursor:pointer}.shell{height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr) 370px;gap:14px;padding:14px}.panel{background:linear-gradient(180deg,var(--soft),rgba(255,255,255,.18));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden;min-height:0}.left,.right,.main{display:flex;flex-direction:column}.brand{padding:18px;border-bottom:1px solid var(--line)}h1{font:650 20px/1.05 var(--serif);margin:0}h2{font-size:15px;margin:0}h3{font-size:14px;margin:0 0 8px}.muted,p{color:var(--muted);font-size:13px;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-bottom:1px solid var(--line)}.stat{border:1px solid var(--line);border-radius:15px;padding:10px;background:rgba(255,255,255,.22)}.stat b{font-size:21px}.stat span{display:block;color:var(--muted);font:10px var(--mono);text-transform:uppercase;letter-spacing:.06em}.search{padding:12px;border-bottom:1px solid var(--line)}input{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:11px 12px;outline:none}.nav{padding:10px;display:grid;gap:7px}.nav button,.pill,.mini{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.22);padding:8px 10px;text-align:left;font-size:12px}.nav button.active{background:var(--ink);color:var(--bg)}.label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:11px 14px 7px}.chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 12px 14px;overflow:auto}.pill small{color:var(--muted)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.content{overflow:auto;padding:16px;min-height:0}.scroll{overflow:auto;min-height:0}.grid{display:grid;gap:14px}.dash{grid-template-columns:1.1fr .9fr}.cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.wide{grid-column:1/-1}.card,.claim{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.26);padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.035)}.claim{background:var(--paper);display:grid;gap:9px}.who{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:11px var(--mono)}.text{font-size:14px;line-height:1.45}.meta{display:flex;gap:6px;flex-wrap:wrap}.tag{font:10px var(--mono);border:1px solid var(--line);border-radius:999px;padding:5px 7px;color:var(--muted);background:rgba(255,255,255,.2)}.problem{color:var(--ink);background:rgba(36,92,255,.08)}.rel{border-left:2px solid var(--line);padding:6px 0 6px 9px;font-size:12px;display:flex;gap:8px}.support{border-color:var(--blue)}.oppose{border-color:var(--red)}.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.heat button{border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.23);padding:10px;text-align:left}.bar{height:5px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ink)}.graph{height:500px;position:relative;overflow:hidden}.graph svg{width:100%;height:100%;display:block}.edge{stroke-opacity:.38}.edge.support{stroke:var(--blue)}.edge.oppose{stroke:var(--red)}.node{cursor:pointer}.svglabel{font:10px var(--sans);fill:var(--muted);pointer-events:none}.inspector{padding:15px;display:grid;gap:12px}.title{font:650 18px/1.1 var(--serif)}.drop{border:1px dashed var(--line);border-radius:16px;padding:12px;background:rgba(255,255,255,.16)}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.col{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:12px}.tiny{font-size:12px;line-height:1.35;border-top:1px solid var(--line);padding-top:7px;margin-top:7px}.route{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.step{min-width:235px;border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:12px}@media(max-width:1050px){body{overflow:auto}.shell{grid-template-columns:1fr;height:auto}.graph{height:360px}}
  </style>
</head>
<body>
  <noscript><div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">JavaScript is required for the interactive atlas. All app files are present in this repo: index.html, app.js, philosophers-data.json.</div></noscript>
  <div id="app" class="shell" data-theme="light">
    <aside class="panel left"><div class="brand"><h1>Philosophers Discovery Atlas</h1><p>Thinkers, concepts, problems, postulates, support, opposition, threads, comparison.</p></div><div class="stats" id="stats"></div><div class="search"><input id="q" placeholder="Search ideas, thinkers, concepts…"></div><div class="nav" id="nav"></div><div class="label">Concept lenses</div><div class="chips" id="concepts"></div><div class="label">Problem lenses</div><div class="chips" id="problems"></div></aside>
    <main class="panel main"><div class="topbar"><div><h2 id="viewTitle">Atlas</h2><p id="sub" style="margin:4px 0 0"></p></div><div><button class="mini" id="theme">Theme</button><button class="mini" id="reset">Reset</button></div></div><div class="content" id="content"><p>Loading…</p></div></main>
    <aside class="panel right"><div class="topbar"><h2>Inspector</h2></div><div class="scroll inspector" id="inspector"></div></aside>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
