<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Philosophers Atlas</title>
  <meta name="description" content="A dense interactive atlas for browsing philosophers, concepts, problems, tensions, routes, and postulates." />
  <style>
    :root{
      --bg:#f5f1e8;--paper:#fffdf8;--paper2:#f8f2e8;--ink:#15120e;--muted:#71695e;--faint:#a59b8d;--line:rgba(21,18,14,.13);--hair:rgba(21,18,14,.075);
      --blue:#245cff;--red:#b94439;--green:#307754;--gold:#a17a20;--violet:#6f59c9;--brown:#8b674a;
      --shadow:0 24px 80px rgba(38,28,13,.10);--r:22px;--r2:14px;
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;--serif:ui-serif,Georgia,"New York",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    [data-theme="dark"]{--bg:#0f0e0d;--paper:#171615;--paper2:#1d1b19;--ink:#f6efe5;--muted:#aaa096;--faint:#736b63;--line:rgba(246,239,229,.15);--hair:rgba(246,239,229,.075);--blue:#86adff;--red:#ff9188;--green:#9bd7ad;--gold:#d5b55c;--violet:#b6a6ff;--brown:#c19b7b;--shadow:0 24px 90px rgba(0,0,0,.36)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:radial-gradient(circle at 0 -10%,rgba(36,92,255,.11),transparent 36%),radial-gradient(circle at 92% -4%,rgba(185,68,57,.10),transparent 33%),linear-gradient(180deg,var(--bg),var(--paper2));color:var(--ink);font-family:var(--sans);font-size:13px;overflow-y:auto}button,input{font:inherit;color:inherit}button{cursor:pointer}b{font-weight:670}p{margin:0;color:var(--muted);line-height:1.35}.app{width:min(1800px,100%);margin:0 auto;padding:12px 12px 36px}.top{position:sticky;top:0;z-index:20;margin-bottom:10px;border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--paper) 90%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(22px);overflow:hidden}.topMain{display:grid;grid-template-columns:260px minmax(260px,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--hair)}.brand h1{font:720 21px/.95 var(--serif);letter-spacing:-.035em;margin:0}.brand p{font-size:11px;margin-top:4px}.search input{width:100%;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:10px 13px;outline:none}.stats{display:flex;gap:7px;justify-content:flex-end}.stat{min-width:70px;border:1px solid var(--hair);border-radius:16px;padding:7px 9px;background:rgba(255,255,255,.17)}.stat strong{display:block;font-size:18px;line-height:1}.stat span,.eyebrow{font:9px/1.1 var(--mono);letter-spacing:.075em;text-transform:uppercase;color:var(--muted)}.navBar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--hair)}.activeBar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;min-height:38px;background:rgba(255,255,255,.12)}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.18);padding:6px 9px;font:10px/1 var(--mono);text-decoration:none;color:inherit}.chip.active,.viewBtn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.viewBtn{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.16);padding:7px 10px;text-align:center;font:11px/1 var(--mono)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px;align-items:start}.surface,.context{border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--paper) 82%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px);padding:10px}.context{position:sticky;top:142px}.panelTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 2px 10px}.panelTitle h2{font:680 19px/1 var(--serif);letter-spacing:-.025em;margin:0}.panelTitle p{font-size:12px;margin-top:4px}.grid{display:grid;gap:9px}.cols2{grid-template-columns:1.1fr .9fr}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.card{border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.035)}.compactCard{border:1px solid var(--hair);border-radius:16px;background:rgba(255,255,255,.18);padding:9px}.claim{border:1px solid var(--line);border-radius:17px;background:var(--paper);display:grid;grid-template-columns:145px minmax(0,1fr);gap:10px;padding:9px 10px;align-items:start}.claim:hover{border-color:color-mix(in srgb,var(--blue) 45%,var(--line));box-shadow:0 8px 28px rgba(36,92,255,.08)}.claimAuthor{display:grid;gap:4px;align-content:start}.claimAuthor b{font-size:11px}.claimAuthor span{font:9px/1.1 var(--mono);color:var(--muted)}.claimText{font-size:13px;line-height:1.34;letter-spacing:-.003em}.claimBody{display:grid;gap:7px}.semantic{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.domain{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid var(--hair);padding:4px 6px;font:9px/1 var(--mono);color:var(--muted);background:rgba(255,255,255,.18)}.domain i{width:6px;height:6px;border-radius:50%;display:block}.concept{display:inline-flex;align-items:center;border-radius:999px;padding:4px 6px;font:10px/1 var(--sans);color:var(--muted);background:rgba(0,0,0,.035)}.problem{font:11px/1.15 var(--serif);color:var(--ink);background:color-mix(in srgb,var(--blue) 8%,transparent);border:1px solid color-mix(in srgb,var(--blue) 18%,transparent);border-radius:999px;padding:4px 7px}.gloss{font-size:11px;color:var(--muted);line-height:1.25}.rel{border-left:2px solid var(--line);padding:4px 0 4px 8px;font-size:11px;line-height:1.25;color:var(--muted)}.rel b{color:var(--ink)}.rel.support{border-color:var(--blue)}.rel.oppose{border-color:var(--red)}.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:7px}.heat button{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:9px;text-align:left}.heat b{font-size:12px}.heat p{font-size:11px;margin-top:3px}.bar{height:4px;border-radius:99px;background:var(--hair);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--ink)}.graphBox{height:490px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid var(--hair);overflow:hidden}.graphBox svg{width:100%;height:100%;display:block}.edge{stroke-opacity:.36}.edge.support{stroke:var(--blue)}.edge.oppose{stroke:var(--red)}.node{cursor:pointer}.svglabel{font:9px var(--sans);fill:var(--muted);pointer-events:none}.indexLayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:10px}.indexColumn{display:grid;gap:6px}.indexItem{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:9px 10px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.indexItem.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.group{border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden}.groupHead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 11px;border-bottom:1px solid var(--hair);background:rgba(255,255,255,.12)}.groupHead span{font:10px var(--mono);color:var(--muted)}.postulates{display:grid}.postulate{padding:8px 11px;border-bottom:1px solid var(--hair);font-size:12px;line-height:1.32}.postulate:last-child{border-bottom:0}.routeStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.routeCard{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px;text-align:left}.routeCard.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.step{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px}.matrix{display:grid;grid-template-columns:170px repeat(var(--cols,4),minmax(84px,1fr));gap:4px}.cell{border:1px solid var(--hair);border-radius:10px;padding:7px;background:rgba(255,255,255,.14);font-size:11px;min-height:32px}.cell.hot{background:color-mix(in srgb,var(--blue) calc(var(--p)*1%),transparent)}.contextStack{display:grid;gap:9px}.contextHero{border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:12px}.contextHero .big{font:720 24px/.95 var(--serif);letter-spacing:-.03em}.empty{border:1px dashed var(--line);border-radius:18px;padding:14px;color:var(--muted)}.drop{border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.11);padding:12px}.drop input{width:100%;margin-top:8px}.mobileNav{display:none}.density .claim{grid-template-columns:122px minmax(0,1fr)}.density .claimText{font-size:12px}.density .card,.density .surface,.density .context{padding:9px}.density .concept:nth-of-type(n+7),.density .domain:nth-of-type(n+3){display:none}
    @media(max-width:1240px){.workspace{grid-template-columns:1fr}.context{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.topMain{grid-template-columns:220px minmax(220px,1fr) auto}.graphBox{height:410px}.indexLayout{grid-template-columns:220px minmax(0,1fr)}}
    @media(max-width:820px){.app{padding:8px 8px 76px}.top{position:static;border-radius:22px}.topMain{grid-template-columns:1fr;gap:8px}.stats{justify-content:stretch}.stat{flex:1}.navBar{display:none}.activeBar{align-items:flex-start}.workspace{gap:8px}.surface,.context{border-radius:22px}.cards,.cols2,.cols3,.indexLayout{grid-template-columns:1fr}.claim{grid-template-columns:1fr;gap:6px}.claimAuthor{display:flex;gap:8px;align-items:baseline}.graphBox{height:330px}.matrix{grid-template-columns:130px repeat(var(--cols,4),minmax(62px,1fr))}.mobileNav{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(22px);box-shadow:var(--shadow)}.mobileNav button{text-align:center;justify-content:center;padding:8px 3px;font-size:10px}.context{display:grid;grid-template-columns:1fr}}
  </style>
</head>
<body>
  <noscript><div style="padding:22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">JavaScript is required for the interactive atlas.</div></noscript>
  <div id="app" class="app" data-theme="light">
    <header class="top">
      <div class="topMain">
        <div class="brand"><h1>Philosophers Atlas</h1><p>Concepts, problems, postulates, influence, opposition.</p></div>
        <div class="search"><input id="q" type="search" placeholder="Search author, postulate, concept, problem…" /></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="navBar" id="nav"></div>
      <div class="activeBar" id="activeBar"></div>
    </header>
    <section class="workspace">
      <main class="surface">
        <div class="panelTitle"><div><h2 id="viewTitle">Atlas</h2><p id="sub"></p></div><div class="semantic"><button class="chip" id="density">Density</button><button class="chip" id="theme">Theme</button><button class="chip" id="reset">Reset</button></div></div>
        <div id="content"><div class="empty">Loading philosophers.json…</div></div>
      </main>
      <aside class="context" id="context"></aside>
    </section>
  </div>
  <nav class="mobileNav" id="mobileNav"></nav>
  <script src="app.js" defer></script>
</body>
</html>
