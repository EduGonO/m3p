<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Philosophers Atlas</title>
  <meta name="description" content="A dense, relational atlas for philosophers, postulates, concepts, problems, routes, influence, and opposition." />
  <style>
    :root{
      --bg:#f5f1e8;--paper:#fffdf8;--paper2:#f8f2e8;--ink:#15120e;--muted:#71695f;--faint:#a89d8d;--line:rgba(21,18,14,.13);--hair:rgba(21,18,14,.075);
      --blue:#245cff;--red:#b74439;--green:#317756;--gold:#a37818;--violet:#6d58c8;--brown:#8a674b;
      --shadow:0 22px 70px rgba(38,28,13,.10);
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;--serif:ui-serif,Georgia,"New York",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    [data-theme="dark"]{--bg:#0f0e0d;--paper:#171615;--paper2:#1d1b19;--ink:#f6efe5;--muted:#aaa096;--faint:#746b61;--line:rgba(246,239,229,.16);--hair:rgba(246,239,229,.08);--blue:#86adff;--red:#ff9188;--green:#9bd7ad;--gold:#d5b55c;--violet:#b6a6ff;--brown:#c19b7b;--shadow:0 24px 90px rgba(0,0,0,.36)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:radial-gradient(circle at 0 -10%,rgba(36,92,255,.11),transparent 36%),radial-gradient(circle at 92% -4%,rgba(183,68,57,.10),transparent 33%),linear-gradient(180deg,var(--bg),var(--paper2));color:var(--ink);font-family:var(--sans);font-size:13px;overflow-y:auto}button,input{font:inherit;color:inherit}button{cursor:pointer}b{font-weight:700}p{margin:0;color:var(--muted);line-height:1.35}.app{width:min(1860px,100%);margin:0 auto;padding:12px 12px 36px}.top{position:sticky;top:0;z-index:30;margin-bottom:10px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--paper) 92%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(22px);overflow:hidden}.topMain{display:grid;grid-template-columns:238px minmax(260px,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--hair)}.brand h1{font:720 21px/.95 var(--serif);letter-spacing:-.035em;margin:0}.brand p{font-size:11px;margin-top:4px}.search input{width:100%;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:10px 13px;outline:none}.stats{display:flex;gap:7px;justify-content:flex-end}.stat{min-width:72px;border:1px solid var(--hair);border-radius:15px;padding:7px 9px;background:rgba(255,255,255,.16)}.stat strong{display:block;font-size:17px;line-height:1}.stat span,.eyebrow{font:9px/1.1 var(--mono);letter-spacing:.075em;text-transform:uppercase;color:var(--muted)}.navBar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--hair)}.activeBar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;min-height:38px;background:rgba(255,255,255,.11)}.chip,.viewBtn{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.18);text-decoration:none;color:inherit}.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;font:10px/1 var(--mono)}.viewBtn{padding:7px 10px;text-align:center;font:11px/1 var(--mono)}.chip.active,.viewBtn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.workspace{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;gap:10px;align-items:start}.rail,.surface,.context{border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--paper) 84%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px);padding:10px}.rail,.context{position:sticky;top:143px}.railSection{border-bottom:1px solid var(--hair);padding:0 0 10px;margin-bottom:10px}.railSection:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}.railTitle,.microTitle{font:9px/1 var(--mono);letter-spacing:.085em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.railList{display:grid;gap:4px}.railRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid transparent;border-radius:12px;background:transparent;padding:6px 7px;text-align:left}.railRow:hover{background:rgba(255,255,255,.18);border-color:var(--hair)}.railRow.active{background:var(--ink);color:var(--bg)}.railRow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.railRow span{font:10px var(--mono);color:var(--muted)}.railRow.active span{color:color-mix(in srgb,var(--bg) 70%,transparent)}.panelTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 2px 10px}.panelTitle h2{font:680 19px/1 var(--serif);letter-spacing:-.025em;margin:0}.panelTitle p{font-size:12px;margin-top:4px}.semantic{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.grid{display:grid;gap:10px}.cols2{grid-template-columns:1.1fr .9fr}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.035)}.graphBox{height:440px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.05));border:1px solid var(--hair);overflow:hidden}.graphBox svg{width:100%;height:100%;display:block}.edge{stroke-opacity:.34}.edge.support{stroke:var(--green)}.edge.challenge{stroke:var(--red)}.node{cursor:pointer}.svglabel{font:9px var(--sans);fill:var(--muted);pointer-events:none}.masonry{column-width:318px;column-gap:10px}.tile{break-inside:avoid;margin:0 0 10px}.claim{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:10px 11px;box-shadow:0 8px 24px rgba(0,0,0,.035)}.claim:hover{border-color:color-mix(in srgb,var(--blue) 45%,var(--line));box-shadow:0 9px 30px rgba(36,92,255,.08)}.claimTop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;margin-bottom:6px}.claimAuthor{font-size:12px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.claimDate{font:10px/1 var(--mono);color:var(--muted);white-space:nowrap}.claimIntro{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}.claimSummary{font-size:11px;color:var(--muted);line-height:1.22}.conceptMono{font:10px/1.1 var(--mono);color:var(--faint);background:rgba(0,0,0,.035);border-radius:6px;padding:2px 5px}.claimText{font-size:13px;line-height:1.35;letter-spacing:-.004em;margin-bottom:7px}.taxonomy{display:grid;gap:5px;margin-top:7px}.taxRow{display:grid;grid-template-columns:60px minmax(0,1fr);gap:7px;align-items:start}.taxLabel{font:9px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}.domains,.questions{display:flex;flex-wrap:wrap;gap:5px}.domain{display:inline-flex;align-items:center;gap:5px;font:10px/1.2 var(--sans);color:var(--muted)}.domain i{width:7px;height:7px;border-radius:50%;display:block}.question{font:11px/1.2 var(--serif);color:var(--ink);border-bottom:1px solid color-mix(in srgb,var(--blue) 28%,transparent)}.relationList{display:grid;gap:4px;margin-top:7px}.relationItem{display:grid;grid-template-columns:18px minmax(0,1fr);gap:7px;align-items:start;padding:5px 7px;border:1px solid var(--hair);border-radius:11px;background:rgba(255,255,255,.12);font-size:11px;line-height:1.25;color:var(--muted)}.relationItem b{color:var(--ink)}.relMark{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;font:700 12px/1 var(--mono);color:white}.relationItem.support .relMark{background:var(--green)}.relationItem.challenge .relMark{background:var(--red)}.miniTabs{display:flex;flex-wrap:wrap;gap:5px}.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(134px,1fr));gap:7px}.heat button{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:9px;text-align:left}.heat b{font-size:12px}.heat p{font-size:11px;margin-top:3px}.bar{height:4px;border-radius:99px;background:var(--hair);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--ink)}.indexLayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px}.indexList{display:grid;gap:5px;align-content:start}.indexItem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:7px 9px;text-align:left}.indexItem b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.indexItem span{font:10px var(--mono);color:var(--muted)}.indexItem.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.group{border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden;margin-bottom:9px}.groupHead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 11px;border-bottom:1px solid var(--hair);background:rgba(255,255,255,.12)}.groupHead span{font:10px var(--mono);color:var(--muted)}.postulates{display:grid}.postulate{padding:8px 11px;border-bottom:1px solid var(--hair);font-size:12px;line-height:1.34}.postulate:last-child{border-bottom:0}.routeStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.routeCard{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px;text-align:left}.routeCard.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.routeCard h3{font-size:13px;margin:0 0 4px}.routeCard p{font-size:11px}.timeline{column-width:250px;column-gap:10px}.step{break-inside:avoid;border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px;margin:0 0 10px}.step h3{margin:0 0 4px;font-size:13px}.matrix{display:grid;grid-template-columns:170px repeat(var(--cols,4),minmax(84px,1fr));gap:4px}.cell{border:1px solid var(--hair);border-radius:10px;padding:7px;background:rgba(255,255,255,.14);font-size:11px;min-height:32px}.cell.hot{background:color-mix(in srgb,var(--blue) calc(var(--p)*1%),transparent)}.contextPanel{display:grid;gap:10px}.contextBlock{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px}.contextHeader{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}.contextHeader h3{font:680 18px/1 var(--serif);letter-spacing:-.02em;margin:0}.contextPostulate{font-size:13px;line-height:1.35;margin-top:7px}.empty{border:1px dashed var(--line);border-radius:18px;padding:14px;color:var(--muted)}.drop{border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.11);padding:12px}.drop input{width:100%;margin-top:8px}.mobileNav{display:none}
    @media(max-width:1220px){.workspace{grid-template-columns:210px minmax(0,1fr)}.context{grid-column:1/-1;position:static}.contextPanel{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.topMain{grid-template-columns:215px minmax(220px,1fr) auto}.graphBox{height:380px}.indexLayout{grid-template-columns:210px minmax(0,1fr)}}
    @media(max-width:760px){.app{padding:8px 8px 76px}.top{position:static;border-radius:22px}.topMain{grid-template-columns:1fr;gap:8px}.stats{justify-content:stretch}.stat{flex:1}.navBar{display:none}.workspace,.indexLayout,.cols2,.cols3{grid-template-columns:1fr}.rail{display:none}.surface,.context{border-radius:22px}.graphBox{height:320px}.masonry{column-width:280px}.claimTop{grid-template-columns:1fr}.taxRow{grid-template-columns:54px minmax(0,1fr)}.matrix{grid-template-columns:128px repeat(var(--cols,4),minmax(60px,1fr))}.mobileNav{position:fixed;left:8px;right:8px;bottom:8px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(22px);box-shadow:var(--shadow)}.mobileNav button{text-align:center;justify-content:center;padding:8px 3px;font-size:10px}}
  </style>
</head>
<body>
  <noscript><div style="padding:22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">JavaScript is required for the interactive atlas.</div></noscript>
  <div id="app" class="app" data-theme="light">
    <header class="top">
      <div class="topMain">
        <div class="brand"><h1>Philosophers Atlas</h1><p>Grounded in philosophers.json.</p></div>
        <div class="search"><input id="q" type="search" placeholder="Search author, postulate, concept, problem…" /></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="navBar" id="nav"></div>
      <div class="activeBar" id="activeBar"></div>
    </header>
    <section class="workspace">
      <aside class="rail" id="rail"></aside>
      <main class="surface">
        <div class="panelTitle"><div><h2 id="viewTitle">Atlas</h2><p id="sub"></p></div><div class="semantic"><button class="chip" id="theme">Theme</button><button class="chip" id="reset">Reset</button></div></div>
        <div id="content"><div class="empty">Loading philosophers.json…</div></div>
      </main>
      <aside class="context" id="context"></aside>
    </section>
  </div>
  <nav class="mobileNav" id="mobileNav"></nav>
  <script src="app.js" defer></script>
</body>
</html>
