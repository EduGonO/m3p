<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>philo atlas</title>
  <meta name="description" content="A dense relational atlas for philosophers, postulates, concepts, questions, routes, supports, and challenges." />
  <style>
    :root{
      --bg:#f5f1e8;--paper:#fffdf8;--paper2:#f8f2e8;--ink:#15120e;--muted:#756d62;--faint:#aaa094;--line:rgba(21,18,14,.13);--hair:rgba(21,18,14,.075);
      --blue:#245cff;--red:#b74439;--green:#317756;--gold:#a37818;--violet:#6d58c8;--brown:#8a674b;--shadow:0 20px 60px rgba(36,26,12,.10);
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;--serif:ui-serif,Georgia,"New York",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    [data-theme="dark"]{--bg:#0f0e0d;--paper:#171615;--paper2:#1d1b19;--ink:#f6efe5;--muted:#aaa096;--faint:#756d64;--line:rgba(246,239,229,.16);--hair:rgba(246,239,229,.08);--blue:#86adff;--red:#ff9188;--green:#9bd7ad;--gold:#d5b55c;--violet:#b6a6ff;--brown:#c19b7b;--shadow:0 22px 70px rgba(0,0,0,.35)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:radial-gradient(circle at 4% -8%,rgba(36,92,255,.11),transparent 32%),radial-gradient(circle at 94% -5%,rgba(183,68,57,.10),transparent 34%),linear-gradient(180deg,var(--bg),var(--paper2));color:var(--ink);font-family:var(--sans);font-size:13px}button,input{font:inherit;color:inherit}button{cursor:pointer}b{font-weight:720}p{margin:0;color:var(--muted);line-height:1.34}.app{height:100%;width:min(1880px,100%);margin:0 auto;display:grid;grid-template-rows:54px minmax(0,1fr);gap:8px;padding:10px 12px 12px}.top{position:relative;z-index:20;display:grid;grid-template-columns:auto minmax(320px,620px);justify-content:space-between;align-items:center;gap:22px;padding:0 8px}.top:before{content:"";position:absolute;inset:-10px -12px -18px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent) 0%,color-mix(in srgb,var(--bg) 66%,transparent) 46%,transparent 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);mask-image:linear-gradient(#000 0 62%,transparent 100%);-webkit-mask-image:linear-gradient(#000 0 62%,transparent 100%)}.brand h1{margin:0;font:760 24px/.9 var(--serif);letter-spacing:-.05em;text-transform:lowercase;padding-left:2px}.search{justify-self:end;width:min(620px,100%)}.search input{width:100%;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--paper) 76%,transparent);padding:11px 16px;outline:none;box-shadow:0 10px 34px rgba(30,20,8,.065);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.workspace{min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 370px;gap:10px}.rail,.context{height:100%;overflow:auto;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--paper) 84%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px}.surface{height:100%;overflow:auto;padding:0 4px 24px}.railSection{border-bottom:1px solid var(--hair);padding:0 0 10px;margin-bottom:10px}.railSection:last-child{border-bottom:0;margin-bottom:0}.railTitle,.microTitle{font:650 9px/1 var(--mono);letter-spacing:.085em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.railSection:first-child .railTitle{font:760 10.5px/1 var(--mono);color:var(--ink);letter-spacing:.075em}.navGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.navBtn,.railRow,.filterToken{border:1px solid transparent;border-radius:13px;background:transparent;text-align:left}.navBtn{display:flex;gap:6px;align-items:center;padding:7px 8px;font:11px/1 var(--mono)}.navBtn i{font-style:normal;color:var(--faint);width:13px;text-align:center}.navBtn:hover,.railRow:hover,.filterToken:hover,.relationItem:hover,.postulate:hover,.inspectable:hover,.compactClaim:hover{border-color:color-mix(in srgb,var(--blue) 34%,var(--line));background:rgba(255,255,255,.18);box-shadow:0 8px 22px rgba(36,92,255,.065)}.navBtn.active,.railRow.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.navBtn.active i{color:var(--bg)}.railList{display:grid;gap:4px}.railRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 7px}.railRow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500}.railRow span{font:10px var(--mono);color:var(--muted)}.railRow.active span{color:color-mix(in srgb,var(--bg) 70%,transparent)}.miniTabs,.filterStack,.semantic{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.18);padding:6px 9px;font:10px/1 var(--mono)}.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.filterToken{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--paper);border-color:var(--line);padding:6px 7px;font-size:11px}.filterToken b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filterToken span{font:10px var(--mono);color:var(--muted)}.panelTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 9px;padding:0 1px}.panelTitle h2{display:none}.panelTitle p{font:10px/1.2 var(--mono);letter-spacing:.02em;color:var(--muted)}.grid{display:grid;gap:10px}.cols2{grid-template-columns:1.08fr .92fr}.card{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.035)}.graphBox{height:430px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid var(--hair);overflow:hidden}.graphBox svg{width:100%;height:100%;display:block}.edge{stroke-opacity:.34}.edge.support{stroke:var(--green)}.edge.challenge{stroke:var(--red)}.node{cursor:pointer}.svglabel{font:9px var(--sans);fill:var(--muted);pointer-events:none}.masonry{column-width:318px;column-gap:10px}.tile{break-inside:avoid;margin:0 0 10px}.claim{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:10px 11px;box-shadow:0 8px 24px rgba(0,0,0,.035)}.claim:hover{border-color:color-mix(in srgb,var(--blue) 42%,var(--line));box-shadow:0 9px 28px rgba(36,92,255,.08)}.claimTop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;margin-bottom:6px}.claimAuthor{font-size:13px;line-height:1.08;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.claimDate{font:10px/1 var(--mono);color:var(--muted);white-space:nowrap}.claimIntro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;margin-bottom:7px}.claimSummary{font-size:11px;color:var(--muted);line-height:1.22}.conceptMono{font:10px/1.1 var(--mono);color:var(--faint);background:rgba(0,0,0,.035);border-radius:6px;padding:2px 5px;text-align:right;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.claimText{font-size:13px;line-height:1.35;letter-spacing:-.004em;margin-bottom:7px}.taxonomy{display:grid;gap:5px;margin-top:7px}.taxRow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:7px;align-items:start}.taxLabel{font:9px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}.domains,.questions,.concepts{display:flex;flex-wrap:wrap;gap:5px}.domain{display:inline-flex;align-items:center;gap:5px;font:10px/1.2 var(--sans);color:var(--muted);border:1px solid transparent;border-radius:8px;padding:2px 4px;background:rgba(255,255,255,.08)}.domain i{width:7px;height:7px;border-radius:50%;display:block}.question{font:11px/1.2 var(--serif);color:var(--ink);border:0;border-bottom:1px solid color-mix(in srgb,var(--blue) 28%,transparent);border-radius:0;background:transparent;padding:1px 0}.relationList{display:grid;gap:4px;margin-top:7px}.relationItem{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;align-items:start;padding:5px 7px;border:1px solid var(--hair);border-radius:11px;background:rgba(255,255,255,.12);font-size:11px;line-height:1.25;color:var(--muted);text-align:left}.relationItem b{color:var(--ink)}.relMark{display:grid;place-items:center;width:14px;height:14px;border-radius:50%;font:700 10px/1 var(--mono);color:#fff}.relationItem.support .relMark{background:var(--green)}.relationItem.challenge .relMark{background:var(--red)}.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:7px}.heat button{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:9px;text-align:left}.heat b{font-size:12px}.heat p{font-size:11px;margin-top:3px}.bar{height:4px;border-radius:99px;background:var(--hair);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--ink)}.group{border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden;margin-bottom:9px}.groupHead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 11px;border-bottom:1px solid var(--hair);background:rgba(255,255,255,.12)}.groupHead span{font:10px var(--mono);color:var(--muted)}.postulates{display:grid}.postulate{padding:8px 11px;border:0;border-bottom:1px solid var(--hair);border-radius:0;background:transparent;text-align:left;font-size:12px;line-height:1.34}.postulate:last-child{border-bottom:0}.authorFocus{max-width:920px;margin:0 auto}.authorHero{border:1px solid var(--line);border-radius:22px;background:var(--paper);padding:14px;margin-bottom:10px}.authorHeroTop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline}.authorHero h2{margin:0;font:760 25px/1 var(--serif);letter-spacing:-.035em}.authorHero .date{font:11px var(--mono);color:var(--muted)}.compactClaims{display:grid;gap:6px}.compactClaim{border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:9px 10px;text-align:left}.compactClaim .claimIntro{margin-bottom:5px}.routeStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.routeCard{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px;text-align:left}.routeCard.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.routeCard h3{font-size:13px;margin:0 0 4px}.routeCard p{font-size:11px}.timeline{column-width:250px;column-gap:10px}.step{break-inside:avoid;border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px;margin:0 0 10px}.step h3{margin:0 0 4px;font-size:13px}.matrix{display:grid;grid-template-columns:170px repeat(var(--cols,4),minmax(84px,1fr));gap:4px}.cell{border:1px solid var(--hair);border-radius:10px;padding:7px;background:rgba(255,255,255,.14);font-size:11px;min-height:32px}.cell.hot{background:color-mix(in srgb,var(--blue) calc(var(--p)*1%),transparent)}.contextPanel{display:grid;gap:10px}.contextBlock{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:11px}.contextHeader{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline}.contextHeader h3{font:700 19px/1 var(--serif);letter-spacing:-.025em;margin:0}.contextHeader span{font:10px/1 var(--mono);color:var(--muted);white-space:nowrap}.contextPostulate{font-size:13px;line-height:1.35;margin-top:7px}.accordion{border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.12);overflow:hidden}.accordion+ .accordion{margin-top:6px}.accordion summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px}.accordion summary::-webkit-details-marker{display:none}.accordion summary b{font-size:12px}.accordion summary span{font:10px var(--mono);color:var(--muted)}.accordion[open] summary{border-bottom:1px solid var(--hair)}.empty{border:1px dashed var(--line);border-radius:18px;padding:14px;color:var(--muted)}.drop{border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.11);padding:12px}.drop input{width:100%;margin-top:8px}.mobileNav{display:none}
    @media(max-width:1220px){body{overflow:auto}.app{height:auto;min-height:100%;display:block}.top{position:sticky;top:0;margin-bottom:8px}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px}.rail{height:calc(100vh - 76px);position:sticky;top:68px}.surface{height:auto;overflow:visible}.context{grid-column:1/-1;height:auto;overflow:visible;position:static}.contextPanel{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.graphBox{height:380px}}
    @media(max-width:760px){.app{padding:8px 8px 76px}.top{position:static;grid-template-columns:1fr;gap:8px}.brand h1{text-align:center}.workspace,.cols2{grid-template-columns:1fr}.rail{display:none}.surface,.context{height:auto;overflow:visible}.graphBox{height:320px}.masonry{column-width:280px}.claimIntro{grid-template-columns:1fr}.conceptMono{text-align:left;max-width:100%}.taxRow{grid-template-columns:52px minmax(0,1fr)}.matrix{grid-template-columns:128px repeat(var(--cols,4),minmax(60px,1fr))}.mobileNav{position:fixed;left:8px;right:8px;bottom:8px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(22px);box-shadow:var(--shadow)}.mobileNav button{text-align:center;justify-content:center;padding:8px 3px;font-size:10px}}
  </style>
</head>
<body>
  <noscript><div style="padding:22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">JavaScript is required for the interactive atlas.</div></noscript>
  <div id="app" class="app" data-theme="light">
    <header class="top">
      <div class="brand"><h1>philo atlas</h1></div>
      <div class="search"><input id="q" type="search" placeholder="Search authors, postulates, links, concepts, problems…" /></div>
    </header>
    <section class="workspace">
      <aside class="rail" id="rail"></aside>
      <main class="surface">
        <div class="panelTitle"><div><h2 id="viewTitle">Atlas</h2><p id="sub"></p></div><div class="semantic"><button class="chip" id="theme">Theme</button><button class="chip" id="reset">Reset</button></div></div>
        <div id="content"><div class="empty">Loading philosophers.json…</div></div>
      </main>
      <aside class="context" id="context"></aside>
    </section>
  </div>
  <nav class="mobileNav" id="mobileNav"></nav>
  <script src="app.js" defer></script>
</body>
</html>
