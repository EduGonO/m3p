<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>philo atlas</title>
  <style>
    :root{
      --bg:#f5f1e8;--paper:#fffdf8;--ink:#15120e;--muted:#766d62;--faint:#aaa094;--line:rgba(21,18,14,.14);--hair:rgba(21,18,14,.075);
      --blue:#245cff;--red:#b74439;--green:#317756;--gold:#a37818;--violet:#6d58c8;--brown:#8a674b;--shadow:0 18px 54px rgba(32,23,10,.10);
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;--serif:ui-serif,Georgia,"New York",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    [data-theme=dark]{--bg:#0f0e0d;--paper:#171615;--ink:#f6efe5;--muted:#aaa096;--faint:#756d64;--line:rgba(246,239,229,.16);--hair:rgba(246,239,229,.08);--blue:#86adff;--red:#ff9188;--green:#9bd7ad;--gold:#d5b55c;--violet:#b6a6ff;--brown:#c19b7b;--shadow:0 20px 64px rgba(0,0,0,.35)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:radial-gradient(circle at 5% -8%,rgba(36,92,255,.11),transparent 30%),radial-gradient(circle at 94% -5%,rgba(183,68,57,.10),transparent 32%),linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 82%,var(--paper)));color:var(--ink);font:13px var(--sans)}button,input{font:inherit;color:inherit}button{cursor:pointer}p{margin:0;color:var(--muted);line-height:1.35}.app{height:100%;width:min(1880px,100%);margin:auto;display:grid;grid-template-rows:54px minmax(0,1fr);gap:6px;padding:10px 12px 12px}.top{position:relative;z-index:10;display:grid;grid-template-columns:auto minmax(250px,460px);justify-content:space-between;align-items:center;gap:18px;padding:0 10px}.top:before{content:"";position:absolute;inset:-10px -12px -24px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 94%,transparent),color-mix(in srgb,var(--bg) 58%,transparent),transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);mask-image:linear-gradient(#000 0 58%,transparent 100%);-webkit-mask-image:linear-gradient(#000 0 58%,transparent 100%)}.brand{font:760 24px/.9 var(--serif);letter-spacing:-.05em;text-transform:lowercase;white-space:nowrap}.search{justify-self:end;width:100%}.search input{width:100%;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--paper) 76%,transparent);padding:10px 15px;outline:none;box-shadow:0 10px 34px rgba(30,20,8,.065);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .layout{min-height:0;display:grid;grid-template-columns:246px minmax(0,1fr) 372px;gap:10px}.rail,.context{height:100%;overflow:auto;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--paper) 84%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px}.main{height:100%;overflow:auto;padding:0 4px 32px}.section{border-bottom:1px solid var(--hair);padding-bottom:10px;margin-bottom:10px}.section:last-child{border:0;margin:0;padding:0}.label{font:760 10.5px/1 var(--mono);letter-spacing:.075em;text-transform:uppercase;color:var(--ink);margin-bottom:7px}.subLabel{font:650 9px/1 var(--mono);letter-spacing:.085em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.navGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.nav,.row,.token,.chip,.line,.postulate,.rel,.accordionHead{border:1px solid transparent;border-radius:13px;background:transparent;text-align:left}.nav{display:flex;gap:7px;align-items:center;padding:7px 8px;font:11px/1 var(--mono)}.nav i{font-style:normal;color:var(--faint);width:12px;text-align:center}.nav.active,.row.active,.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.list{display:grid;gap:4px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 7px}.row b{font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row span{font:10px var(--mono);color:var(--muted)}.row.active span,.nav.active i{color:color-mix(in srgb,var(--bg) 72%,transparent)}.tabs,.tokens,.meta{display:flex;flex-wrap:wrap;gap:5px}.chip{border-color:var(--line);border-radius:999px;background:rgba(255,255,255,.18);padding:6px 9px;font:10px/1 var(--mono)}.token{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border-color:var(--line);background:var(--paper);padding:6px 7px;font-size:11px}.token b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.token span{font:10px var(--mono);color:var(--muted)}.nav:hover,.row:hover,.token:hover,.line:hover,.postulate:hover,.rel:hover,.accordionHead:hover,.inspectable:hover,.bullet:hover{border-color:color-mix(in srgb,var(--blue) 34%,var(--line));background:rgba(255,255,255,.18);box-shadow:0 8px 22px rgba(36,92,255,.06)}.card,.hero,.group,.chapter{border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 8px 24px rgba(0,0,0,.035)}.card{padding:12px}.hero{padding:14px;margin-bottom:10px}.heroTop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline}.hero h2{margin:0;font:760 25px/1 var(--serif);letter-spacing:-.035em}.group{overflow:hidden;margin-bottom:10px}.groupHead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:9px 11px;border-bottom:1px solid var(--hair);background:rgba(255,255,255,.12)}.groupHead b{font-size:12px}.date,.count,.rc{font:10px/1 var(--mono);color:var(--muted);white-space:nowrap}.outline{display:grid}.line{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:9px 10px;border-radius:0;border-bottom:1px solid var(--hair);width:100%;transition:background .14s ease,border-color .14s ease,box-shadow .14s ease}.line:last-child{border-bottom:0}.bullet{appearance:none;display:grid;place-items:center;width:18px;height:18px;margin:0;padding:0;border:1px solid var(--hair);border-radius:999px;background:color-mix(in srgb,var(--paper) 72%,transparent);color:var(--muted);font:650 12px/1 var(--mono);text-align:center;transition:background .14s ease,border-color .14s ease,color .14s ease,box-shadow .14s ease}.bullet[aria-expanded=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}.lineMain{min-width:0}.lineTop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;margin-bottom:4px}.author{appearance:none;display:block;justify-self:start;max-width:100%;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;text-align:left;font-weight:720;font-size:12.5px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.claimText{font-size:13px;line-height:1.36;letter-spacing:-.004em}.meta{margin-top:6px;align-items:center}.mono{appearance:none;font:10px/1.1 var(--mono);color:var(--faint);background:rgba(0,0,0,.035);border:1px solid transparent;border-radius:6px;padding:2px 5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.domain{appearance:none;display:inline-flex;align-items:center;gap:5px;font:10px/1.2 var(--sans);color:var(--muted);border:1px solid transparent;border-radius:8px;padding:2px 4px;background:rgba(255,255,255,.08)}.domain i{width:7px;height:7px;border-radius:50%;display:block}.question{appearance:none;font:11px/1.2 var(--serif);color:var(--ink);border:1px solid transparent;border-bottom-color:color-mix(in srgb,var(--blue) 28%,transparent);border-radius:0;background:transparent;padding:1px 0}.counts{display:flex;gap:5px;font:10px/1 var(--mono)}.plus{color:var(--green)}.minus{color:var(--red)}.expanded{grid-column:2;margin-top:7px;padding:8px 9px;border:1px solid var(--hair);border-radius:13px;background:rgba(255,255,255,.12)}.relList{display:grid;gap:4px}.relStack{margin-top:10px}.rel{display:grid;grid-template-columns:15px minmax(0,1fr);gap:7px;align-items:start;padding:5px 7px;border:1px solid var(--hair);border-radius:11px;background:rgba(255,255,255,.12);font-size:11px;line-height:1.25;color:var(--muted)}.rel b{color:var(--ink)}.mark{display:grid;place-items:center;width:14px;height:14px;border-radius:50%;font:700 10px/1 var(--mono);color:#fff}.support .mark{background:var(--green)}.challenge .mark{background:var(--red)}.graph{height:410px;border-radius:18px;border:1px solid var(--hair);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.04));margin-bottom:10px}.graph svg{width:100%;height:100%}.edge{stroke-opacity:.34}.edge.support{stroke:var(--green)}.edge.challenge{stroke:var(--red)}.svglabel{font:9px var(--sans);fill:var(--muted);pointer-events:none}.chapters{display:grid;gap:10px}.chapter{padding:10px}.chapterTitle{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font:720 11px/1 var(--mono);letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px}.chapterTitle span{font:10px var(--mono);color:var(--muted)}.postulates{display:grid}.postulate{padding:8px 11px;border:1px solid transparent;border-bottom-color:var(--hair);border-radius:0;background:transparent;font-size:12px;line-height:1.34;width:100%}.postulate:last-child{border-bottom-color:transparent}.accordion{border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.12);overflow:hidden}.accordion+.accordion{margin-top:6px}.accordionHead{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px}.accordionHead b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.accordionBody{border-top:1px solid var(--hair)}.accordionBody[hidden]{display:none}.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{border:1px solid var(--hair);border-radius:12px;padding:8px;background:rgba(255,255,255,.12)}.stat b{display:block;font-size:15px}.stat span{font:9px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.empty{border:1px dashed var(--line);border-radius:18px;padding:14px;color:var(--muted)}.clusterClaims{margin-left:0!important;padding-left:0!important;border-left:0!important;}
    @media(max-width:1220px){body{overflow:auto}.app{height:auto;min-height:100%;display:block}.top{position:sticky;top:0;margin-bottom:8px;grid-template-columns:auto minmax(220px,420px)}.layout{grid-template-columns:200px minmax(0,1fr) 300px;gap:8px}.rail,.context{height:calc(100vh - 76px);position:sticky;top:68px}.main{height:auto;overflow:visible}.graph{height:340px}}
    @media(max-width:900px){.layout{display:grid;grid-template-columns:196px minmax(0,1fr);grid-template-areas:"rail main" "context context"}.rail{grid-area:rail;height:calc(100vh - 76px)}.main{grid-area:main}.context{grid-area:context;height:auto;position:relative;top:auto}}
    @media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100%;display:block;padding:8px 8px 76px}.top{position:sticky;top:0;grid-template-columns:auto minmax(130px,46vw);gap:8px;padding:0 4px;margin-bottom:8px}.brand{font-size:22px}.search input{padding:9px 11px;font-size:12px}.layout{display:grid;grid-template-columns:1fr;grid-template-areas:"rail" "main" "context";gap:8px}.rail,.context,.main{height:auto;overflow:visible;position:relative;top:auto}.rail{padding:8px;border-radius:20px}.navGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{justify-content:center;padding:7px 3px;font-size:10px}.nav i{display:none}.section{padding-bottom:8px;margin-bottom:8px}.line{grid-template-columns:20px minmax(0,1fr);padding:8px}.graph{height:300px}.mono{max-width:100%}}
  </style>
</head>
<body>
  <noscript><div style="padding:22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">JavaScript is required.</div></noscript>
  <div id="app" class="app" data-theme="light">
    <header class="top"><div class="brand">philo atlas</div><div class="search"><input id="q" type="search" placeholder="Search authors, postulates, concepts…" /></div></header>
    <section class="layout"><aside class="rail" id="rail"></aside><main class="main"><div id="content"><div class="empty">Loading philosophers.json…</div></div></main><aside class="context" id="context"></aside></section>
  </div>
  <script src="app.js" defer></script>
  <script>
    (() => {
      const selected = { type: null, val: null };
      const inject = () => {
        if (document.getElementById('ui-final-polish')) return;
        const style = document.createElement('style');
        style.id = 'ui-final-polish';
        style.textContent = `
          .line{padding:4px!important;background:transparent!important;box-shadow:none!important;border-left-color:transparent!important;border-right-color:transparent!important;border-top-color:transparent!important;grid-template-columns:minmax(0,1fr)!important;}
          .line:hover{background:transparent!important;box-shadow:none!important;border-left-color:transparent!important;border-right-color:transparent!important;border-top-color:transparent!important;border-bottom-color:var(--hair)!important;}
          .lineMain,.clusterLine{padding:6px 7px!important;border:1px solid transparent!important;border-radius:11px!important;background:transparent!important;transition:background .14s ease,border-color .14s ease,box-shadow .14s ease;}
          .line:hover .lineMain,.clusterLine:hover{border-color:color-mix(in srgb,var(--blue) 30%,var(--line))!important;background:rgba(255,255,255,.16)!important;box-shadow:0 8px 22px rgba(36,92,255,.045)!important;}
          .authorCluster{padding:4px!important;}
          .clusterHead{padding:0 7px!important;}
          .clusterHead[hidden]{display:none!important;}
          .clusterClaims{margin-left:0!important;padding-left:0!important;border-left:0!important;gap:4px!important;}
          .clusterHead[hidden]+.clusterClaims{margin-top:0!important;}
          .line[data-selected="true"] .lineMain,.clusterLine[data-selected="true"]{border-color:color-mix(in srgb,var(--blue) 44%,var(--line))!important;background:color-mix(in srgb,var(--blue) 8%,transparent)!important;box-shadow:0 8px 24px rgba(36,92,255,.08)!important;}
          .author[data-selected="true"],.clusterAuthor[data-selected="true"]{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.08em;color:var(--ink)!important;}
          .mono[data-selected="true"],.domain[data-selected="true"],.question[data-selected="true"],.counts[data-selected="true"],.line[data-selected="true"] .counts,.clusterLine[data-selected="true"] .counts{border-color:color-mix(in srgb,var(--blue) 38%,var(--line))!important;background:color-mix(in srgb,var(--blue) 10%,transparent)!important;color:var(--ink)!important;box-shadow:0 6px 18px rgba(36,92,255,.06)!important;}
          .row[data-selected="true"],.chip[data-selected="true"]{border-color:color-mix(in srgb,var(--blue) 42%,var(--line))!important;background:color-mix(in srgb,var(--blue) 10%,transparent)!important;}
        `;
        document.head.appendChild(style);
      };
      const cssEscape = value => (window.CSS && CSS.escape) ? CSS.escape(String(value)) : String(value).replace(/"/g, '\\"');
      const clearSelected = () => document.querySelectorAll('[data-selected="true"]').forEach(el => el.removeAttribute('data-selected'));
      const mark = () => {
        clearSelected();
        if (!selected.type || selected.val == null) return;
        const val = cssEscape(selected.val);
        const map = {
          statement: `[data-act="inspectStatement"][data-val="${val}"]`,
          person: `[data-act="inspectPerson"][data-val="${val}"],[data-act="filter"][data-kind="person"][data-val="${val}"]`,
          concept: `[data-act="inspectConcept"][data-val="${val}"],[data-act="filter"][data-kind="concept"][data-val="${val}"]`,
          question: `[data-act="inspectQuestion"][data-val="${val}"],[data-act="filter"][data-kind="question"][data-val="${val}"]`,
          domain: `[data-act="inspectDomain"][data-val="${val}"],[data-act="filter"][data-kind="domain"][data-val="${val}"]`
        };
        document.querySelectorAll(map[selected.type] || '').forEach(el => el.setAttribute('data-selected', 'true'));
      };
      const normalize = () => {
        document.querySelectorAll('.authorCluster .clusterHead .date').forEach(el => {
          const clean = el.textContent.split('·')[0].trim();
          if (el.textContent !== clean) el.textContent = clean;
        });
        document.querySelectorAll('.group').forEach(group => {
          const groupName = group.querySelector(':scope > .groupHead b')?.textContent.trim();
          const groupMeta = group.querySelector(':scope > .groupHead .count');
          if (groupMeta) {
            const clean = groupMeta.textContent.split('·')[0].trim();
            if (groupMeta.textContent !== clean) groupMeta.textContent = clean;
          }
          group.querySelectorAll(':scope > .authorCluster').forEach(cluster => {
            const clusterName = cluster.querySelector(':scope > .clusterHead .clusterAuthor')?.textContent.trim();
            const clusterHead = cluster.querySelector(':scope > .clusterHead');
            if (clusterHead && groupName && clusterName === groupName) clusterHead.hidden = true;
          });
        });
        mark();
      };
      const remember = event => {
        const el = event.target.closest('[data-act]');
        if (!el) return;
        const { act, kind, val } = el.dataset;
        const direct = { inspectStatement: 'statement', inspectPerson: 'person', inspectConcept: 'concept', inspectQuestion: 'question', inspectDomain: 'domain' };
        if (direct[act]) {
          selected.type = direct[act];
          selected.val = val;
          setTimeout(normalize, 0);
          return;
        }
        if (act === 'filter' && ['person', 'concept', 'question', 'domain'].includes(kind)) {
          selected.type = kind;
          selected.val = val;
          setTimeout(normalize, 0);
        }
      };
      const start = () => {
        inject();
        document.addEventListener('click', remember, true);
        const content = document.getElementById('content');
        const rail = document.getElementById('rail');
        if (content) new MutationObserver(normalize).observe(content, { childList: true, subtree: true });
        if (rail) new MutationObserver(normalize).observe(rail, { childList: true, subtree: true });
        normalize();
      };
      document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', start) : start();
    })();
  </script>
</body>
</html>
