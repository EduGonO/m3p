rder-bottom:1px solid var(--hair)}.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{border:1px solid var(--hair);border-radius:12px;padding:8px;background:rgba(255,255,255,.12)}.stat b{display:block;font-size:15px}.stat span{font:9px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.empty{border:1px dashed var(--line);border-radius:18px;padding:14px;color:var(--muted)}
    @media(max-width:1220px){body{overflow:auto}.app{height:auto;min-height:100%;display:block}.top{position:sticky;top:0;margin-bottom:8px;grid-template-columns:auto minmax(220px,420px)}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-areas:"rail main" "context context";gap:10px}.rail{grid-area:rail;height:calc(100vh - 76px);position:sticky;top:68px}.main{grid-area:main;height:auto;overflow:visible}.context{grid-area:context;height:auto;overflow:visible}.graph{height:340px}.masonry{column-width:280px}}
