<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paysage de pensée</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #ffffff;
      color: #1d1d1f;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      height: 100vh;
      gap: 0;
    }
    
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #e5e5e7;
      padding: 40px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    
    .header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #1d1d1f;
      text-transform: lowercase;
    }

    .header .subtitle {
      font-size: 12px;
      color: #86868b;
      text-transform: lowercase;
    }
    
    .header .tagline {
      font-size: 12px;
      color: #86868b;
      text-transform: lowercase;
      opacity: 0.8;
    }
    
    .upload-zone {
      border: 1px dashed #d2d2d7;
      background: #fafafa;
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .upload-zone:hover {
      border-color: #86868b;
      background: #f5f5f7;
    }
    
    .upload-zone.dragover {
      border-color: #1d1d1f;
      background: #f5f5f7;
    }
    
    .upload-zone input {
      display: none;
    }
    
    .upload-zone .content {
      font-size: 11px;
      color: #86868b;
      text-transform: lowercase;
      line-height: 1.6;
    }

    .upload-info {
      display: none;
      width: 100%;
      text-align: left;
    }

    .upload-info .filename {
      font-size: 12px;
      font-weight: 500;
      color: #1d1d1f;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: lowercase;
    }

    .progress-container {
      width: 100%;
      height: 4px;
      background: #e5e5e7;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #1d1d1f;
      transition: width 0.3s ease;
    }
    
    .doc-summary {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .doc-summary-title {
      font-size: 10px;
      font-weight: 600;
      color: #86868b;
      text-transform: lowercase;
      letter-spacing: 0.05em;
    }

    .doc-summary-text {
      font-size: 12px;
      color: #1d1d1f;
      text-transform: lowercase;
      line-height: 1.6;
    }

    .notions-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    
    .notions-title {
      font-size: 10px;
      font-weight: 600;
      color: #86868b;
      text-transform: lowercase;
      letter-spacing: 0.05em;
    }
    
    .notions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .notion-item {
      border: 1px solid #e5e5e7;
      border-radius: 6px;
      font-size: 12px;
      color: #1d1d1f;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: lowercase;
      background: #ffffff;
      overflow: hidden;
    }
    
    .notion-item:hover {
      border-color: #86868b;
    }
    
    .notion-item.active {
      border-color: #1d1d1f;
      background: #fafafa;
    }

    .notion-header {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .notion-item.active .notion-header {
      font-weight: 500;
    }

    .notion-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background: #ffffff;
      border-top: 0px solid #e5e5e7;
    }

    .notion-item.active .notion-details {
      max-height: 500px;
      border-top-width: 1px;
      padding: 12px;
    }
    
    .notion-item.loading {
      color: #86868b;
      border-style: dashed;
      background: #fafafa;
      cursor: default;
      padding: 12px;
    }

    .notion-weight {
      font-size: 9px;
      color: #86868b;
      font-weight: 400;
    }

    .citation-block {
      font-size: 11px;
      color: #86868b;
      line-height: 1.5;
      padding-top: 8px;
      border-top: 1px solid #f5f5f7;
      margin-top: 8px;
      font-style: italic;
    }
    
    .canvas-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
      cursor: grab;
    }

    .canvas-wrapper:active {
      cursor: grabbing;
    }
    
    #archipelCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    .status-indicator {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 11px;
      color: #86868b;
      text-transform: lowercase;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    
    .tooltip {
      position: absolute;
      background: #ffffff;
      border: 1px solid #e5e5e7;
      border-radius: 8px;
      padding: 16px;
      font-size: 12px;
      color: #1d1d1f;
      max-width: 320px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      opacity: 0;
      transition: opacity 0.15s ease;
      line-height: 1.6;
    }
    
    .tooltip h3 {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      text-transform: lowercase;
    }
    
    .tooltip p {
      color: #86868b;
      text-transform: lowercase;
    }
    
    .tooltip .context {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f5f5f7;
      font-style: italic;
      color: #86868b;
    }
    
    .tooltip.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="header">
        <h1>paysage de pensée</h1>
        <div class="subtitle">projet - eduardo gonzalez ortiz</div>
        <div class="tagline">cartographie conceptuelle de dissertation et de mémoire</div>
      </div>
      
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
        <div class="content" id="uploadContent">
          <p>déposer un fichier ou cliquer pour parcourir<br/>(pdf, txt, markdown)</p>
        </div>
        <div class="upload-info" id="uploadInfo">
          <div class="filename" id="filenameDisplay">document.pdf</div>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
      </div>

      <div class="doc-summary" id="docSummary">
        <div class="doc-summary-title">résumé</div>
        <div class="doc-summary-text" id="summaryText"></div>
      </div>
      
      <div class="notions-list" id="notionsList" style="display: none;">
        <div class="notions-title">notions</div>
        <div id="notionsContainer" class="notions-container"></div>
      </div>
    </div>
    
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="archipelCanvas"></canvas>
      <div class="status-indicator" id="statusIndicator">prêt</div>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="archipel.js"></script>
</body>
</html>
