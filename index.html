<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Archipel Sémantique — Constellation d'Idées</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #ffffff;
      color: #1d1d1f;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      height: 100vh;
      gap: 0;
    }
    
    .sidebar {
      width: 300px;
      background: #f5f5f7;
      border-right: 1px solid #d2d2d7;
      padding: 32px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .sidebar h1 {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1d1d1f;
    }
    
    .upload-zone {
      border: 1px solid #d2d2d7;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .upload-zone:hover {
      border-color: #86868b;
      transform: translateY(-1px);
    }
    
    .upload-zone.dragover {
      border-color: #0066cc;
      background: rgba(0, 102, 204, 0.05);
    }
    
    .upload-zone input {
      display: none;
    }
    
    .upload-zone p {
      font-size: 14px;
      color: #86868b;
      cursor: pointer;
      font-weight: 400;
    }
    
    .info-panel {
      border-top: 1px solid #d2d2d7;
      padding-top: 16px;
      font-size: 13px;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .info-label {
      color: #86868b;
    }
    
    .info-value {
      color: #1d1d1f;
      font-weight: 500;
    }
    
    .chunks-list {
      margin-top: 8px;
    }
    
    .chunks-list-title {
      font-size: 11px;
      font-weight: 600;
      color: #86868b;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .chunk-item {
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 12px;
      color: #1d1d1f;
      cursor: pointer;
      transition: all 0.2s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .chunk-item:hover {
      border-color: #86868b;
      background: #fafafa;
    }
    
    .chunk-item.active {
      border-color: #1d1d1f;
      background: #1d1d1f;
      color: #ffffff;
      font-weight: 500;
    }
    
    .canvas-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }
    
    #archipelCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    .status-bar {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #d2d2d7;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      color: #86868b;
      backdrop-filter: saturate(180%) blur(20px);
      transition: all 0.3s ease;
    }
    
    .status-bar.processing {
      color: #0066cc;
    }
    
    .status-bar.error {
      color: #e30000;
    }
    
    .status-bar.success {
      color: #008000;
      border-color: #008000;
    }
    
    .tooltip {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      color: #1d1d1f;
      max-width: 300px;
      pointer-events: none;
      z-index: 100;
      backdrop-filter: saturate(180%) blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      transition: opacity 0.2s ease;
    }
    
    .tooltip.visible {
      opacity: 1;
    }
    
    .tooltip.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        height: auto;
        max-height: 250px;
        border-right: none;
        border-bottom: 1px solid #d2d2d7;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>L'Archipel Sémantique</h1>
      
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
        <p>Drop file here or click to browse<br/>(PDF, TXT, Markdown)</p>
      </div>
      
      <div class="info-panel">
        <div class="info-item">
          <span class="info-label">Chunks</span>
          <span class="info-value" id="chunkCount">0</span>
        </div>
        <div class="info-item">
          <span class="info-label">Embeddings</span>
          <span class="info-value" id="embeddingCount">0</span>
        </div>
        <div class="info-item">
          <span class="info-label">Status</span>
          <span class="info-value" id="statusLabel">Ready</span>
        </div>
      </div>
      
      <div class="chunks-list" id="chunksList" style="display: none;">
        <div class="chunks-list-title">Fragments</div>
        <div id="chunksContainer"></div>
      </div>
    </div>
    
    <div class="canvas-wrapper">
      <canvas id="archipelCanvas"></canvas>
      <div class="status-bar" id="statusBar">Ready</div>
      <div class="tooltip hidden" id="tooltip"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="archipel.js"></script>
</body>
</html>
